[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backuprig"
version = "0.1.0"
description = "Cross-platform desktop app to back up and diff network/virtualization device configs (Cisco, MikroTik, Kerio Control, ESXi, and any SSH device) with an encrypted local vault."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "sasoun1366" }]
requires-python = ">=3.9"
keywords = [
    "network", "backup", "cisco", "mikrotik", "kerio", "esxi", "vmware",
    "configuration-management", "ssh", "gui", "desktop",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=41.0",
    "paramiko>=3.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
dev = ["pytest>=7.0"]
dev-gui = ["pytest>=7.0", "PyQt6>=6.5"]
packaging = ["pyinstaller>=6.0", "PyQt6>=6.5"]

[project.urls]
Homepage = "https://github.com/sasoun1366/backuprig"
Issues = "https://github.com/sasoun1366/backuprig/issues"

[project.scripts]
backuprig = "backuprig.cli:main"
backuprig-gui = "backuprig.gui.app:main"

[tool.setuptools]
packages = ["backuprig", "backuprig.adapters", "backuprig.gui"]

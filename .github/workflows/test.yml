name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core, no GUI)
        run: pip install -e ".[dev]"
      - name: Run core tests (excluding GUI)
        run: pytest -q --ignore=tests/test_gui.py

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 \
            libglx-mesa0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libfontconfig1 libdbus-1-3
      - name: Install (with GUI extra)
        run: pip install -e ".[dev-gui]"
      - name: Run GUI smoke tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests/test_gui.py
